<!doctype html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collections — Prevoya</title>
<meta name="description" content="A traveler's collections on Prevoya — real places, really visited, ready to use.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%232a9d78'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--paper:#faf6ee;--ink:#23231e;--dim:#6b6a5f;--soft:#8a8676;--green:#0d7a5e;--amber:#b06c0a;
  --line:#e4ddcf;--card:#fff;--body:'Nunito',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 0 60px}
.nav{display:flex;align-items:center;gap:8px;padding:4px 0 26px}
.nav a{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:900;font-size:1.05rem}
.nav i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#45c49b,#0d7a5e);display:inline-block}
.prof{text-align:center;padding:6px 0 10px}
.ring{width:84px;height:84px;border-radius:50%;padding:3px;margin:0 auto;background:linear-gradient(45deg,#f0c06a,#e2766a)}
.ring b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
  background:var(--card);border:3px solid var(--paper);font-size:2rem;font-weight:900;color:var(--green)}
.prof h1{margin:12px 0 2px;font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
.kick{font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;color:var(--green);font-weight:700}
.tag{color:var(--dim);font-size:.9rem;margin:8px auto 0;max-width:40ch}
.cards{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.ccard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;box-shadow:0 10px 26px rgba(40,30,10,.08);transition:transform .15s ease,box-shadow .15s ease}
.ccard:active{transform:scale(.985)}
.cstrip{display:flex;gap:2px;background:linear-gradient(135deg,#efe9db,#e7e0cf)}
.cstrip img{aspect-ratio:1;object-fit:cover;flex:1;min-width:0;width:33%;opacity:0;transition:opacity .5s ease}
.cstrip img.on{opacity:1}
.cbody{display:flex;align-items:center;gap:10px;padding:13px 15px}
.cbody b{font-size:1.02rem;font-weight:900}
.cbody .meta{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;color:var(--green);margin-top:4px}
.cbody .go{margin-left:auto;font-family:var(--mono);font-size:.62rem;color:var(--green);border:1.5px solid rgba(13,122,94,.4);
  border-radius:999px;padding:9px 13px;white-space:nowrap}
.state{padding:44px 0;text-align:center;color:var(--soft);font-family:var(--mono);font-size:.68rem;letter-spacing:.08em}
.door{display:block;text-align:center;margin:34px auto 0;max-width:330px;background:var(--ink);color:#fff;text-decoration:none;
  font-weight:900;font-size:.95rem;border-radius:999px;padding:15px 22px;box-shadow:0 10px 24px rgba(40,30,10,.22)}
.quiet{text-align:center;font-size:.78rem;color:var(--soft);margin-top:12px}
footer{text-align:center;font-size:.72rem;color:var(--soft);padding:34px 0 20px}
footer a{color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="/"><i></i>Prevoya</a></div>
  <div class="prof" id="prof" hidden>
    <div class="ring"><b id="pvInitial">·</b></div>
    <h1 id="pvName"></h1>
    <div class="kick">COLLECTIONS ON PREVOYA</div>
    <p class="tag" id="pvTag" hidden></p>
  </div>
  <div class="cards" id="cards"></div>
  <div class="state" id="state">OPENING…</div>
  <a class="door" id="door" href="/app/" hidden>⌲ Keep your own places — free</a>
  <p class="quiet" id="doorq" hidden>Save what you discover. Share one link. No password, ever.</p>
  <noscript><div class="state">This page needs JavaScript to load the collections.</div></noscript>
</div>
<footer>Prevoya · made by a traveler who lost too many places</footer>
<script src="/shared/supabase-config.js"></script>
<script src="/shared/track.js"></script>
<script>
(function(){
  'use strict';
  var cfg = (window.TRIPOS_SUPABASE || {});
  var slug = (new URLSearchParams(location.search).get('u') ||
              (location.pathname.match(/^\/g\/([a-zA-Z0-9-]+)/) || [])[1] ||
              '').toLowerCase().replace(/[^a-z0-9-]/g,'');
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }

  if (!slug || !cfg.url){ $('state').textContent = 'NOTHING HERE YET.'; return; }

  fetch(cfg.url + '/functions/v1/profile?u=' + encodeURIComponent(slug))
    .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function(d){
      document.title = d.name + '’s collections — Prevoya';
      $('pvName').textContent = d.name;
      $('pvInitial').textContent = (d.name||'·').charAt(0).toUpperCase();
      if (d.tagline){ $('pvTag').textContent = d.tagline; $('pvTag').hidden = false; }
      $('prof').hidden = false;

      var cols = d.collections || [];
      if (!cols.length){ $('state').textContent = 'NO COLLECTIONS SHARED YET.'; }
      else {
        $('state').hidden = true;
        $('cards').innerHTML = cols.map(function(c){
          var covers = (c.covers||[]).slice(0,3).map(function(n){
            return '<img alt="" data-pn="' + esc(n) + '">';
          }).join('');
          return '<a class="ccard" href="/s/?t=' + encodeURIComponent(c.token) + '">' +
            '<span class="cstrip">' + covers + '</span>' +
            '<span class="cbody"><span><b>' + esc(c.title) + '</b>' +
            '<span class="meta">' + c.count + ' PLACES' + (c.been ? ' · ✓ BEEN TO ' + c.been : '') + '</span></span>' +
            '<span class="go">OPEN ⌲</span></span></a>';
        }).join('');
        resolveCovers();
      }
      $('door').hidden = false; $('doorq').hidden = false;
      try { window.pvTrack && window.pvTrack('gprof_view', { slug: slug }); } catch(_){}
    })
    .catch(function(e){
      $('state').textContent = (String(e.message) === '404') ? 'NOTHING HERE YET.' : 'COULD NOT LOAD — TRY AGAIN.';
    });

  function resolveCovers(){
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.cstrip img[data-pn]'));
    var names = imgs.map(function(i){ return i.getAttribute('data-pn'); });
    if (!names.length || !cfg.anonKey) return;
    fetch(cfg.url + '/functions/v1/places-search', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:cfg.anonKey, Authorization:'Bearer '+cfg.anonKey },
      body: JSON.stringify({ action:'photos', names: names.slice(0,16), maxw: 480 })
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        var uris = (j && j.uris) || {};
        imgs.forEach(function(img){
          var u = uris[img.getAttribute('data-pn')];
          if (!u) return;
          var pre = new Image();
          pre.onload = function(){ img.src = u; img.classList.add('on'); };
          pre.src = u;
        });
      }).catch(function(){});
  }
})();
</script>
</body>
</html>
