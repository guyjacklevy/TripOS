<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prevoya — the Bali shelf (daylight example)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--paper:#faf6ee;--ink:#23231e;--green:#0d7a5e;--amber:#b06c0a;--line:#e4ddcf;--card:#fff;
  --body:'Nunito',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --soft:#8a8373;--dim:#5d574b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:12px max(16px,env(safe-area-inset-left,0px));background:rgba(250,246,238,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(228,221,207,.7)}
.bar .dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.bar b{font-size:1rem;font-weight:900}
.bar .x19{margin-left:auto;font-family:var(--mono);font-size:.54rem;letter-spacing:.1em;color:var(--amber)}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 140px}
.hero{margin-top:16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 10px 28px rgba(40,30,10,.14)}
.hero .strip{display:flex;gap:2px;background:#efe9db;min-height:96px}
.hero .strip img{aspect-ratio:1;object-fit:cover;flex:1;min-width:0;width:33%}
h1{margin:18px 0 0;font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
.ct{font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;color:var(--green);margin:6px 0 0}
.lede{margin:10px 0 0;font-size:.9rem;color:var(--dim)}
.search{display:flex;margin-top:16px}
.search input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;
  padding:0 18px;min-height:46px;font-family:var(--body);font-size:.92rem;color:var(--ink)}
.search input:focus{outline:2px solid rgba(13,122,94,.4)}
.chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin-top:14px;padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;border:1px solid var(--line);
  background:var(--card);color:var(--dim);border-radius:999px;padding:9px 13px;cursor:pointer;flex:none;min-height:36px}
.chips button.on{color:#fff;border-color:var(--green);background:var(--green)}
.chips button:active{transform:scale(.94)}
.area{margin-top:26px}
.area h2{margin:0;font-size:1.05rem;font-weight:900}
.area .ac{font-family:var(--mono);font-size:.54rem;letter-spacing:.08em;color:var(--soft);margin:2px 0 0}
.pl{display:flex;align-items:center;gap:11px;margin-top:10px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pl img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:#efe9db}
.pl .n{min-width:0;flex:1;font-size:.88rem;font-weight:800}
.pl .n span{display:block;font-family:var(--mono);font-weight:500;font-size:.5rem;letter-spacing:.05em;color:var(--soft);margin-top:2px}
.pl .n .bn{color:var(--green);font-weight:700}
.sv{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 13px;
  border-radius:999px;border:1.5px solid rgba(13,122,94,.45);background:none;color:var(--green);
  font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.07em;cursor:pointer}
.sv:active{transform:scale(.95)}
.sv.on{background:var(--green);color:#fff;border-color:var(--green)}
.kbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:10px 10px 10px 16px;box-shadow:0 12px 32px rgba(40,30,10,.22)}
.kbar .kc{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--green);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kbar a{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;
  background:#1c1c18;color:var(--paper);font-weight:800;font-size:.82rem;text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:60;pointer-events:none;
  background:#1c1c18;color:#9fe8cf;font-size:.78rem;font-weight:700;padding:9px 17px;border-radius:999px;
  white-space:nowrap;box-shadow:0 8px 24px rgba(20,15,5,.35);animation:tIn 2.1s ease forwards}
.toast.off{color:#cfc8b8}
@keyframes tIn{0%{opacity:0;transform:translate(-50%,4px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<div class="bar"><span class="dot"></span><b>Prevoya</b><span class="x19">EXAMPLE · ROUND 19 · NOT LIVE</span></div>
<div class="wrap">
  <div class="hero"><div class="strip">
    <img src="/x/15d/assets/ulufish.jpg" alt=""><img src="/x/15d/assets/sayan.jpg" alt=""><img src="/x/15d/assets/borabora.jpg" alt="">
  </div></div>
  <h1>The Bali shelf</h1>
  <p class="ct">50 PLACES · 7 AREAS · CURATED BY PEOPLE WHO WENT</p>
  <p class="lede">Flag ⚑ what you want — it saves in this browser, no account needed.</p>
  <div class="search"><input type="search" placeholder="search these places…" id="q"></div>
  <div class="chips" id="chips">
    <button class="on" data-c="all">ALL 50</button><button data-c="food">FOOD 21</button>
    <button data-c="nightlife">NIGHTLIFE 16</button><button data-c="cafe">CAFE 3</button>
    <button data-c="explore">EXPLORE 3</button><button data-c="surf">SURF 3</button>
    <button data-c="beach">BEACH 2</button><button data-c="gym">GYM 1</button>
    <button data-c="day-club">DAY CLUB 1</button>
  </div>
  <div id="areas"></div>
</div>
<div class="kbar" id="kbar" hidden><span class="kc" id="kc"></span><a href="#">keep it — free →</a></div>
<script>
/* a design example: a handful of the real collection's real places */
var P = [
  ['Uluwatu', 'Suluban Beach (Blue Point)', 'beach', 1], ['Uluwatu', 'Padang Padang Beach', 'surf', 1],
  ['Uluwatu', 'Bingin Beach', 'surf', 1], ['Uluwatu', 'Single Fin', 'nightlife', 1],
  ['Uluwatu', 'Savaya Bali', 'nightlife', 1], ['Uluwatu', 'Ulu Fishmarket', 'food', 1],
  ['Uluwatu', 'Saltwood Bingin', 'cafe', 1], ['Uluwatu', 'NOURISH CAFE ULUWATU', 'cafe', 1],
  ['Uluwatu', 'Uluwatu Temple & Kecak Fire Dance', 'explore', 1], ['Uluwatu', 'Bambu Fitness Bali', 'gym', 1],
  ['Canggu', 'CURE Bali', 'food', 1], ['Canggu', 'Gaucho Woodfire Steakhouse', 'food', 1],
  ['Ubud', 'Cretya Ubud', 'day-club', 1],
  ['Nusa Penida', 'Guyangan Waterfall Nusa Penida', 'explore', 1],
  ['Lombok', 'Gerupuk Inside Surf Point', 'surf', 0]
];
var ART = { food:'food', cafe:'work', nightlife:'nightlife', surf:'beach', beach:'beach', gym:'gym', explore:'explore', 'day-club':'beach' };
var saved = {};
function art(c){ return '/shared/img/cat-' + (ART[c]||'explore') + '.webp'; }
function render(cat, q){
  var areas = {};
  P.forEach(function(p, i){
    if (cat !== 'all' && p[2] !== cat) return;
    if (q && p[1].toLowerCase().indexOf(q) === -1) return;
    (areas[p[0]] = areas[p[0]] || []).push([p, i]);
  });
  var h = '';
  Object.keys(areas).forEach(function(a){
    h += '<section class="area"><h2>' + a + '</h2><p class="ac">' + areas[a].length +
      ' PLACE' + (areas[a].length === 1 ? '' : 'S') + '</p>' +
      areas[a].map(function(e){
        var p = e[0], i = e[1], on = !!saved[i];
        return '<div class="pl"><img alt="" src="' + art(p[2]) + '" onerror="this.style.visibility=\'hidden\'">' +
          '<span class="n">' + p[1] + '<span>' + p[2].toUpperCase().replace('-',' ') +
          (p[3] ? ' · <b class="bn">✓ BEEN</b>' : '') + '</span></span>' +
          '<button type="button" class="sv' + (on ? ' on' : '') + '" data-i="' + i + '">⚑ ' + (on ? 'SAVED' : 'SAVE') + '</button></div>';
      }).join('') + '</section>';
  });
  document.getElementById('areas').innerHTML = h || '<p class="lede" style="margin-top:24px">nothing matches — try another word.</p>';
}
function bar(){
  var n = Object.keys(saved).length;
  var k = document.getElementById('kbar');
  k.hidden = n === 0;
  document.getElementById('kc').textContent = '⚑ ' + n + ' saved';
}
document.getElementById('areas').addEventListener('click', function(ev){
  var b = ev.target.closest('.sv'); if (!b) return;
  var i = b.getAttribute('data-i'), was = !!saved[i];
  if (was) delete saved[i]; else saved[i] = 1;
  b.classList.toggle('on', !was);
  b.textContent = '⚑ ' + (was ? 'SAVE' : 'SAVED');
  var old = document.querySelector('.toast'); if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast' + (was ? ' off' : '');
  t.textContent = was ? 'Removed — off your list' : '⚑ Kept — on your list';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
  bar();
});
var cat = 'all';
document.getElementById('chips').addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-c]'); if (!b) return;
  cat = b.getAttribute('data-c');
  this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
  render(cat, document.getElementById('q').value.trim().toLowerCase());
});
document.getElementById('q').addEventListener('input', function(){
  render(cat, this.value.trim().toLowerCase());
});
render('all', '');
</script>
</body>
</html>
