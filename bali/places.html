<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prevoya — the Bali shelf</title>
  <meta name="description" content="Real Bali places, curated by people who went. Flag ⚑ what you want — it saves instantly, no account needed.">
  <meta property="og:title" content="Prevoya — the Bali shelf">
  <meta property="og:image" content="https://prevoya.app/shared/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Prevoya — save and share places you discover in Bali">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://prevoya.app/shared/brand/og-image.png">
  <link rel="canonical" href="https://prevoya.app/bali/places">
  <link rel="apple-touch-icon" href="/shared/brand/icon-192.png">
  <link rel="icon" href="/shared/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/shared/brand/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
  /* ─── Round 20: the daylight Bali shelf (Guy picked /x/19/a, 28 Nov) ───
     The public shelf leaves the cosmic world — same paper, ink and green
     as the landing, the gift pages and the app shelf. The signed trip
     world keeps its own look behind its doors. */
  :root{--paper:#faf6ee;--ink:#23231e;--green:#0d7a5e;--amber:#b06c0a;--line:#e4ddcf;--card:#fff;
    --body:'Nunito',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
    --soft:#8a8373;--dim:#5d574b}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  .bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
    padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
    background:rgba(250,246,238,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(228,221,207,.7)}
  .bar .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
  .bar .brand{font-size:1rem;font-weight:900;color:var(--ink);text-decoration:none}
  .bar .back{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;
    color:var(--dim);text-decoration:none;min-height:40px;display:inline-flex;align-items:center;padding:0 4px}
  .wrap{max-width:560px;margin:0 auto;
    padding:0 max(16px,env(safe-area-inset-left,0px)) 140px max(16px,env(safe-area-inset-right,0px))}
  .hero{margin-top:16px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 10px 28px rgba(40,30,10,.14)}
  .hero .strip{display:flex;gap:2px;background:#efe9db;min-height:96px}
  .hero .strip img{aspect-ratio:1;object-fit:cover;flex:1;min-width:0;width:33%}
  h1{margin:18px 0 0;font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
  .ct{font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;color:var(--green);margin:6px 0 0}
  .lede{margin:10px 0 0;font-size:.9rem;color:var(--dim)}
  .match-note{margin:10px 0 0;font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;color:var(--green)}
  .search{display:flex;margin-top:16px}
  .search input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;
    padding:0 18px;min-height:46px;font-family:var(--body);font-size:.92rem;color:var(--ink)}
  .search input:focus{outline:2px solid rgba(13,122,94,.4)}
  .chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin-top:14px;padding-bottom:4px;
    scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;border:1px solid var(--line);
    background:var(--card);color:var(--dim);border-radius:999px;padding:9px 13px;cursor:pointer;flex:none;min-height:36px}
  .chips button.on{color:#fff;border-color:var(--green);background:var(--green)}
  .chips button:active{transform:scale(.94)}
  .status{margin-top:28px;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;color:var(--soft);text-align:center}
  .area{margin-top:12px;content-visibility:auto;contain-intrinsic-size:auto 76px;scroll-margin-top:66px}
  .ah{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-family:var(--body);text-align:left}
  .ah:active{background:#f6f1e6}
  .ah .ah-nm{font-size:1.02rem;font-weight:900;color:var(--ink)}
  .ah .ah-n{margin-left:auto;font-family:var(--mono);font-size:.54rem;letter-spacing:.08em;color:var(--soft);white-space:nowrap}
  .ah .ah-car{color:var(--green);font-weight:700;font-size:1rem;flex:none}
  .gcred{margin-top:18px;font-family:var(--mono);font-size:.5rem;letter-spacing:.08em;color:var(--soft);text-align:center}
  .pl{display:flex;align-items:center;gap:11px;margin-top:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .pl:active{background:#f6f1e6}
  .pl img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:#efe9db}
  .pl .n{min-width:0;flex:1;font-size:.88rem;font-weight:800}
  .pl .n em{font-style:normal;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .n span{display:block;font-family:var(--mono);font-weight:500;font-size:.5rem;letter-spacing:.05em;
    color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .pv{color:var(--green);font-weight:900}
  .pl .mm{color:var(--green);font-weight:700}
  .sv{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 13px;
    border-radius:999px;border:1.5px solid rgba(13,122,94,.45);background:none;color:var(--green);
    font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.07em;cursor:pointer}
  .sv:active{transform:scale(.95)}
  .sv.on{background:var(--green);color:#fff;border-color:var(--green)}
  .pl .chev{flex:none;color:var(--soft);font-weight:700;font-size:1rem}
  .kbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:10px 10px 10px 16px;box-shadow:0 12px 32px rgba(40,30,10,.22)}
  .kbar .kc{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--green);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .kbar a{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;
    background:#1c1c18;color:var(--paper);font-weight:800;font-size:.82rem;text-decoration:none}
  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:60;pointer-events:none;
    background:#1c1c18;color:#9fe8cf;font-size:.78rem;font-weight:700;padding:9px 17px;border-radius:999px;
    white-space:nowrap;box-shadow:0 8px 24px rgba(20,15,5,.35);animation:tIn 2.1s ease forwards}
  .toast.off{color:#cfc8b8}
  @keyframes tIn{0%{opacity:0;transform:translate(-50%,4px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.toast{animation:none}}
  /* ── the place sheet: row tap ( › ) opens the full story ── */
  .shw{position:fixed;inset:0;z-index:70;background:rgba(35,35,30,.45);display:none;align-items:flex-end}
  .shw.on{display:flex}
  .sh{width:100%;max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;
    padding:10px max(18px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 22px)}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sh-photo{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#efe9db}
  .sh-photo img{display:block;width:100%;height:190px;object-fit:cover}
  .sh-cred{position:absolute;right:8px;bottom:6px;font-family:var(--mono);font-size:.5rem;letter-spacing:.04em;
    color:#fff;background:rgba(20,15,5,.55);padding:3px 8px;border-radius:999px}
  .sh h3{margin:14px 0 0;font-size:1.2rem;font-weight:900}
  .sh .sub{font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;color:var(--soft);margin:4px 0 0}
  .sh .why{margin:12px 0 0;font-size:.92rem;color:var(--ink)}
  .sh .tip{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--amber);background:#fdf8ec;
    border-radius:0 10px 10px 0;font-size:.85rem;color:var(--dim)}
  .sh .meta{margin:12px 0 0;font-size:.82rem;color:var(--dim)}
  .sh .meta div{margin-top:4px}
  .sh .for{margin:10px 0 0;font-family:var(--mono);font-size:.56rem;letter-spacing:.06em;color:var(--soft)}
  .sh .acts{display:flex;gap:10px;margin-top:18px}
  .sh .acts .sv{min-height:44px;font-size:.6rem;flex:1;justify-content:center}
  .sh .maps{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:44px;
    border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    font-weight:800;font-size:.82rem;text-decoration:none}
  .sh .maps:active{transform:scale(.97)}
  footer{margin-top:44px;font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;color:var(--soft)}
  footer a{color:var(--dim)}
  </style>
</head>
<body>
  <div class="bar">
    <span class="dot"></span><a class="brand" href="/">Prevoya</a>
    <a class="back" href="/bali/">‹ BALI</a>
  </div>
  <div class="wrap">
    <div class="hero"><div class="strip">
      <img src="/shared/img/bali-hero-1.jpg" alt=""><img src="/shared/img/bali-hero-2.jpg" alt=""><img src="/shared/img/bali-hero-3.jpg" alt="">
    </div></div>
    <h1>The Bali shelf</h1>
    <p class="ct" id="shelfCt">LOADING…</p>
    <p class="lede">Flag ⚑ what you want — it saves in this browser, no account needed. Tap a place for its story.</p>
    <p class="match-note" id="matchNote" hidden></p>
    <div class="search"><input type="search" id="q" placeholder="search these places…" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <p class="status" id="placesStatus">Loading the shelf…</p>
    <div id="areas"></div>
    <p class="gcred" id="gcred" hidden>PLACE PHOTOS · THEIR GOOGLE CONTRIBUTORS</p>
    <footer>Prevoya · save and share places you discover · <a href="/bali/">back to Bali</a></footer>
  </div>
  <div class="kbar" id="saveBar" hidden><span class="kc" id="kc"></span><a href="/app/">keep it — free account →</a></div>
  <div class="shw" id="plSh"><div class="sh" id="plShIn"></div></div>
  <script src="../shared/supabase-config.js"></script>
  <script src="../shared/track.js"></script>
  <script type="module" src="../shared/places.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
