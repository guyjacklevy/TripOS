<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Bali route — Prevoya</title>
  <meta name="description" content="A traveler's Bali route, planned by Prevoya. Plan yours in 30 seconds.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a14">
  <link rel="apple-touch-icon" href="/shared/brand/icon-192.png">
  <link rel="icon" href="/shared/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/shared/brand/icon-192.png" type="image/png">
<link rel="stylesheet" href="/shared/tripos.css">
</head>
<body>
  <div class="cosmos"></div>

  <main class="rt-wrap">
    <div id="rtLoading" class="rt-center">
      <div class="scan-state">
        <div class="scan-line"></div>
        <p class="scan-text">OPENING THE ROUTE</p>
      </div>
    </div>

    <div id="rtGone" class="rt-center" hidden>
      <span class="orb planet-teal" style="width:40px;height:40px;margin-bottom:16px"></span>
      <h1 class="rt-h1">This route went private.</h1>
      <p class="rt-sub">The traveler pulled it back — but yours takes 30 seconds.</p>
      <a class="btn btn-primary" href="/bali/">Plan your Bali — free</a>
    </div>

    <div id="rtBody" hidden>
      <p class="rt-kicker" id="rtKicker">// A BALI ROUTE</p>
      <h1 class="rt-h1" id="rtTitle">—</h1>
      <p class="rt-facts" id="rtFacts"></p>

      <div class="cer-map" id="rtMap">
        <svg viewBox="0 0 320 260" width="100%" aria-hidden="true">
          <path id="rtIsland" d="M56,150 C60,110 92,74 140,62 C190,50 246,66 262,96 C276,122 268,148 244,160 C214,174 178,172 156,176 C150,186 146,196 136,202 C132,216 122,228 108,226 C96,224 96,210 104,200 C110,192 108,184 96,178 C76,170 58,168 56,150 Z"
            fill="none" stroke="#7b7b9a" stroke-width="1.5" opacity="0.55"/>
          <ellipse cx="222" cy="204" rx="9" ry="6" fill="none" stroke="#7b7b9a" stroke-width="1.5" opacity="0.55"/>
          <ellipse cx="243" cy="213" rx="5" ry="3.5" fill="none" stroke="#7b7b9a" stroke-width="1.5" opacity="0.45"/>
          <path id="rtTrace" d="" fill="none" stroke="#3dffd0" stroke-width="2" stroke-linecap="round"/>
          <g id="rtDots"></g>
          <g id="rtOrbs"></g>
        </svg>
      </div>

      <div class="cer-legs" id="rtLegs"></div>
      <p class="rt-summary" id="rtSummary" hidden></p>
      <p class="rt-counts" id="rtCounts"></p>

      <div class="rt-cta">
        <a class="btn btn-primary" id="rtCta" href="/bali/">plan yours →</a>
        <p class="note">3 questions · 30 seconds · no password, ever</p>
      </div>
    </div>
  </main>

  <script src="/shared/supabase-config.js"></script>
  <script src="/shared/track.js"></script>
  <script src="/route/route.js" defer></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
